# Daily: download the VNDB dump, recompute all rankings, import into D1.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and the
# repository variable D1_DATABASE_ID. Without the secrets the job still runs
# the pipeline and uploads snapshot.sql as an artifact, but skips the import.
name: Refresh rankings

on:
  schedule:
    # VNDB publishes the dump around 08:00 UTC; scheduled runs only fire on the default branch.
    - cron: "7 12 * * *"
  # Pipeline changes on beta: build a snapshot from the real dump (no import).
  push:
    branches: [beta]
    paths: [pipeline/**, .github/workflows/refresh.yml]
  workflow_dispatch:
    inputs:
      import:
        description: Import the snapshot into D1
        type: boolean
        default: true
      skip_rankit:
        description: Only compute the PONet methods (fast)
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Download VNDB dump (only the tables we use)
        run: |
          sudo apt-get install -y zstd >/dev/null
          curl -fsSL --retry 3 -o db.tar.zst https://dl.vndb.org/dump/vndb-db-latest.tar.zst
          mkdir dump
          patterns=('*TIMESTAMP')
          for t in vn vn_titles vn_relations releases releases_vn releases_producers producers images ulist_vns users; do
            patterns+=("*db/$t" "*db/$t.header")
          done
          tar -I zstd -xf db.tar.zst -C dump --wildcards "${patterns[@]}"
          rm db.tar.zst
          cat dump/TIMESTAMP; du -sh dump/db

      - uses: actions/setup-node@v5
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure D1 database id
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
        run: .github/scripts/configure-d1.sh

      - name: Fetch previous rank history from D1
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          # ~8k rows read; fails harmlessly before the first import.
          npx wrangler d1 execute vndb --remote --json --command "SELECT id, history FROM vn" > ../history.json \
            || echo "[]" > ../history.json
          ls -la ../history.json

      - name: Compute rankings
        working-directory: pipeline
        run: |
          args=(--dump ../dump --out out)
          if [ -f ../history.json ]; then args+=(--history ../history.json); fi
          if [ "${{ inputs.skip_rankit }}" = "true" ]; then args+=(--skip-rankit); fi
          python -m vndb_rank "${args[@]}"
          ls -la out; cat out/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: pipeline/out/
          retention-days: 7

      - name: Import into D1
        if: env.HAS_CLOUDFLARE == 'true' && (github.event_name == 'schedule' || inputs.import)
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute vndb --remote --file ../pipeline/out/snapshot.sql --yes

      - name: Note skipped import
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Cloudflare secrets not configured - snapshot built but not imported."
